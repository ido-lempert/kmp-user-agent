name: Release (Maven Central + npm)

# =============================================================================
# Publishes the `site.lempert:user-agent` library to Maven Central and the
# `@lempert/user-agent` package to npm when a `vX.Y.Z` tag is pushed. Never
# runs on a normal push or PR (see `ci.yml` for that).
#
# --- Release semantics (verified against com.vanniktech.maven.publish 0.37.0
#     source, since `library/build.gradle.kts` calls the bare
#     `publishToMavenCentral()` DSL function with no arguments) ---
# The DSL's `automaticRelease` parameter defaults to `project.automaticRelease()`,
# which reads the `mavenCentralAutomaticPublishing` (or legacy
# `SONATYPE_AUTOMATIC_RELEASE`) Gradle property and falls back to `false` when
# neither is set -- neither is set anywhere in this repo. With
# automaticRelease=false, the `publishToMavenCentral` Gradle task (used below)
# only STAGES the release: it uploads and verifies the deployment but does
# NOT publish it live. A maintainer must go to
# https://central.sonatype.com/publishing/deployments and manually click
# "Publish" on the deployment before it becomes visible to consumers.
# (The plugin also registers a `publishAndReleaseToMavenCentral` task that
# ALWAYS auto-releases regardless of this DSL setting -- deliberately not
# used here, to preserve `library/build.gradle.kts`'s existing configured
# behavior unchanged, per this workflow's spec.)
#
# --- Required GitHub Secrets (Settings -> Secrets and variables -> Actions) ---
# Signing (read automatically by `signAllPublications()` via
# `ORG_GRADLE_PROJECT_*` env vars -- never passed as literals):
#   - ORG_GRADLE_PROJECT_signingInMemoryKey
#   - ORG_GRADLE_PROJECT_signingInMemoryKeyPassword
#   - ORG_GRADLE_PROJECT_signingInMemoryKeyId
# Sonatype Central Portal credentials (read as Gradle properties
# `mavenCentralUsername`/`mavenCentralPassword` via the same
# `ORG_GRADLE_PROJECT_*` env-var convention):
#   - ORG_GRADLE_PROJECT_mavenCentralUsername
#   - ORG_GRADLE_PROJECT_mavenCentralPassword
# npm publishing: uses npm Trusted Publishing (OIDC) -- NOT a static
# NPM_TOKEN secret. Real-world discovery from this session's first live
# release attempts: this npm account requires interactive 2FA approval for
# publishing (confirmed by the maintainer -- a plain `npm publish` from
# their own machine opens a browser tab for approval), which a static
# token (even an "Automation"-type one) cannot satisfy unattended --
# npm's registry masks that rejection as a misleading `404 Not Found`
# rather than a clear auth error. A Trusted Publisher was configured on
# npmjs.com for `@lempert/user-agent` (Settings -> Trusted Publisher),
# pointing at this exact repo (`ido-lempert/kmp-user-agent`) and this
# exact workflow filename (`release.yml`), with "npm publish"/"npm stage
# publish" permissions and no GitHub Environment restriction. That
# requires:
#   1. `permissions.id-token: write` below, so the job can request a
#      short-lived OIDC token from GitHub.
#   2. A modern npm CLI (11.5.1+) on PATH that auto-detects the GitHub
#      Actions OIDC environment and exchanges it for a publish token --
#      via `actions/setup-node` below, NOT the Gradle-toolchain-managed
#      Node used elsewhere in this job, since that version isn't
#      guaranteed OIDC-capable and its exact path is a Gradle internal.
#   3. Publishing via a direct `npm publish` command (see the "Publish to
#      npm" step) rather than the Gradle plugin's own
#      `publishJsPackageToNpmjsRegistry` task -- that task always writes
#      an explicit auth token into its generated `.npmrc`
#      (`library/build.gradle.kts`'s `authToken.set(...)`), which takes
#      precedence over and prevents npm CLI's native OIDC auto-detection.
#      `./gradlew :library:assembleJsPackage` still produces the package
#      contents; only the actual publish step bypasses the plugin.
# No NPM_TOKEN secret is required for this -- an earlier, since-removed
# NPM_TOKEN secret sitting in the repo appears to have interfered with
# OIDC resolution (or its removal simply coincided with the Trusted
# Publisher config finishing propagation; the exact mechanism wasn't
# isolated). Confirmed working end-to-end on 2026-09-08: a rerun against
# the already-published v0.4.0 tag correctly failed with npm's own "You
# cannot publish over the previously published versions" error rather
# than the masked 404 auth-rejection seen in every earlier attempt --
# i.e. OIDC auth succeeded and only the expected duplicate-version check
# rejected it. The five ORG_GRADLE_PROJECT_* secrets below remain
# required for Maven Central.
# =============================================================================

on:
  push:
    tags:
      - 'v*'

permissions:
  # Widened from `read` to `write`: only the iOS release step below needs
  # this (`gh release create` / `gh release upload` require it to create
  # a GitHub Release and attach an asset). Maven Central publishing
  # authenticates with its own separate Sonatype secrets, not
  # GITHUB_TOKEN, so it doesn't need this.
  contents: write
  # Required for npm Trusted Publishing (OIDC) -- lets this job request a
  # short-lived OIDC token from GitHub, which npm CLI 11.5.1+ auto-detects
  # and exchanges for a scoped, single-use publish token. See the header
  # comment above for the full npm-publishing explanation.
  id-token: write

jobs:
  publish:
    runs-on: macos-latest
    # Queue same-tag runs instead of letting them race the same Maven
    # Central deployment; deliberately NOT cancel-in-progress (default
    # false) -- cancelling mid-upload could leave a corrupt/partial
    # deployment staged on Central Portal.
    concurrency:
      group: release-${{ github.ref_name }}
    # Fail fast on a hang talking to Central Portal instead of tying up the
    # runner for GitHub's default 6-hour job limit.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Verify tag version matches library/build.gradle.kts Maven and npm versions
        run: ./scripts/verify-release-version.sh "${GITHUB_REF_NAME}" library/build.gradle.kts

      - name: Verify required secrets are present
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyId }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
        run: |
          set -uo pipefail

          # NPM_TOKEN is intentionally not checked here -- npm publishing
          # uses Trusted Publishing (OIDC), not a static token secret. See
          # this workflow's header comment.
          missing=()
          [ -z "${ORG_GRADLE_PROJECT_signingInMemoryKey}" ] && missing+=("ORG_GRADLE_PROJECT_signingInMemoryKey")
          [ -z "${ORG_GRADLE_PROJECT_signingInMemoryKeyPassword}" ] && missing+=("ORG_GRADLE_PROJECT_signingInMemoryKeyPassword")
          [ -z "${ORG_GRADLE_PROJECT_signingInMemoryKeyId}" ] && missing+=("ORG_GRADLE_PROJECT_signingInMemoryKeyId")
          [ -z "${ORG_GRADLE_PROJECT_mavenCentralUsername}" ] && missing+=("ORG_GRADLE_PROJECT_mavenCentralUsername")
          [ -z "${ORG_GRADLE_PROJECT_mavenCentralPassword}" ] && missing+=("ORG_GRADLE_PROJECT_mavenCentralPassword")

          if [ "${#missing[@]}" -gt 0 ]; then
            for name in "${missing[@]}"; do
              echo "::error::Required secret '${name}' is not set (or is empty). Add it under Settings -> Secrets and variables -> Actions before releasing."
            done
            exit 1
          fi

          echo "All required secrets are present."

      # Stages the release to Maven Central (does not auto-release -- see
      # header comment above). Signing/credentials come from GitHub Secrets
      # via the ORG_GRADLE_PROJECT_* Gradle property convention; nothing is
      # hardcoded here.
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKey }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyPassword }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ORG_GRADLE_PROJECT_signingInMemoryKeyId }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralUsername }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.ORG_GRADLE_PROJECT_mavenCentralPassword }}
        run: ./gradlew :library:publishToMavenCentral

      # Modern Node/npm on PATH for OIDC-based Trusted Publishing -- NOT
      # the Gradle-toolchain-managed Node used by the steps above (its
      # exact npm version/path is a Gradle internal, not guaranteed
      # OIDC-capable). Node 24 bundles npm 11+, well above the 11.5.1
      # minimum Trusted Publishing requires (per npm's own docs:
      # https://docs.npmjs.com/trusted-publishers/).
      #
      # `registry-url` is REQUIRED, not cosmetic -- without it,
      # actions/setup-node writes no .npmrc at all, so npm CLI has
      # nothing to hook its OIDC exchange into and fails with a plain
      # ENEEDAUTH ("need auth ... npm adduser"), confirmed by this
      # session's first OIDC attempt (which omitted this and failed
      # exactly that way). No `cache` input -- v4.x's `cache` expects a
      # package-manager name (e.g. "npm"), not a boolean; omitting it
      # already means no caching, matching npm's own documented example
      # ("package-manager-cache: false") for release builds, which is a
      # v5+ input name this workflow doesn't use.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Publishes the js target's dist output as @lempert/user-agent to
      # the npmjs registry via a direct `npm publish`, deliberately NOT
      # the org.jetbrains.kotlin.npm-publish plugin's own
      # `publishJsPackageToNpmjsRegistry` task (that task's generated
      # `.npmrc` always carries an explicit auth token, which pre-empts
      # npm CLI's native OIDC auto-detection) and NOT
      # `stagePublishJsPackage`, which has known bugs (see
      # `_bmad-output/implementation-artifacts/deferred-work.md`) and is
      # out of scope to fix here. `assembleJsPackage` produces the same
      # package contents (including the `publishConfig.access: "public"`
      # fix already in `library/build.gradle.kts`) that the Gradle
      # plugin's own task would have published. No NPM_TOKEN needed --
      # npm CLI reads GitHub's ACTIONS_ID_TOKEN_REQUEST_* env vars
      # (present because of `permissions.id-token: write` above) and
      # exchanges them against the Trusted Publisher configured on
      # npmjs.com for this exact repo + workflow filename.
      - name: Publish to npm
        run: |
          ./gradlew :library:assembleJsPackage
          cd library/build/packages/js
          npm publish --access=public

      # --- iOS: verify + release --------------------------------------
      # Rebuilds the XCFramework fresh in CI (NEVER trusts a locally
      # committed/cached artifact) and zips it exactly the way
      # scripts/prepare-ios-release.sh and the original 0.2.0 release
      # process do, then hands the freshly computed checksum to
      # scripts/verify-ios-checksum.sh, which compares it (and the
      # committed url's tag segment) against what's committed in
      # Package.swift's .binaryTarget(name: "Library", ...) call for this
      # tag. That comparison logic lives in the testable script (see
      # scripts/verify-ios-checksum.test.sh, run on every push/PR via
      # ci.yml) rather than being inlined here. This is a safety net
      # only: it never writes Package.swift itself -- the maintainer
      # computes and commits that checksum/url by hand (via
      # scripts/prepare-ios-release.sh) before tagging, since a tag is
      # immutable and CI can't fix it after the fact. Runs on
      # macos-latest (this job's runner), which has Xcode/`swift`/`zip`
      # preinstalled -- the `command -v` checks below are cheap and kept
      # for consistency with prepare-ios-release.sh's own guards, not
      # because macos-latest is expected to be missing either.
      - name: Verify iOS XCFramework checksum matches Package.swift
        run: |
          set -euo pipefail

          if ! command -v swift >/dev/null 2>&1; then
            echo "::error::'swift' command not found on this runner."
            exit 1
          fi
          if ! command -v zip >/dev/null 2>&1; then
            echo "::error::'zip' command not found on this runner."
            exit 1
          fi

          ./gradlew :library:assembleLibraryReleaseXCFramework

          XCFRAMEWORK_DIR="library/build/XCFrameworks/release"
          ZIP_PATH="${XCFRAMEWORK_DIR}/Library.xcframework.zip"

          rm -f "${ZIP_PATH}"
          # -x '*.DS_Store': a stray .DS_Store inside the XCFramework
          # directory (plausible on any macOS runner, including
          # macos-latest) would produce a different zip/checksum between
          # two otherwise-identical builds, causing a false mismatch.
          (cd "${XCFRAMEWORK_DIR}" && zip -r -X Library.xcframework.zip Library.xcframework -x '*.DS_Store')

          COMPUTED_CHECKSUM=$(swift package compute-checksum "${ZIP_PATH}")

          if [ -z "${COMPUTED_CHECKSUM}" ]; then
            echo "::error::'swift package compute-checksum' produced empty output for ${ZIP_PATH}."
            exit 1
          fi

          ./scripts/verify-ios-checksum.sh "${GITHUB_REF_NAME}" "${COMPUTED_CHECKSUM}" Package.swift

      # Creates the GitHub Release for this tag (idempotent -- re-running
      # after a transient earlier failure won't fail/duplicate) and
      # uploads the just-verified XCFramework zip as the asset
      # Package.swift's url expects. Uses the gh CLI (preinstalled on
      # GitHub-hosted runners) rather than a third-party action. Only
      # reached if the checksum-verify step above passed: it runs under
      # `set -euo pipefail` and exits non-zero on any mismatch, and
      # GitHub Actions skips all later steps in the job by default once a
      # step fails.
      - name: Create GitHub Release and upload iOS XCFramework asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          ZIP_PATH="library/build/XCFrameworks/release/Library.xcframework.zip"

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; skipping creation."
          else
            gh release create "${TAG}" --title "${TAG}" --generate-notes
          fi

          # --clobber makes the upload idempotent: a re-run after a
          # transient earlier failure overwrites the same-named asset
          # instead of failing because it already exists.
          gh release upload "${TAG}" "${ZIP_PATH}" --clobber
