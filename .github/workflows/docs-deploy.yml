name: Deploy docs site

# Scoped to docs-site/** (plus this workflow file itself) so a library-only
# commit never triggers a site rebuild/deploy -- see ARCHITECTURE-SPINE.md
# AD-4. Deliberately a separate file from ci.yml (the Gradle build/test
# workflow), which this workflow must never touch or depend on.
on:
  push:
    branches: [master]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; never cancel one that's already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Guards a manual workflow_dispatch the same way the push trigger's
    # `branches: [master]` does -- without this, dispatching from any other
    # branch would build and deploy that branch's content to the live,
    # production Pages site.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v6

      # `npm ci`, never `npm install`, so the build only ever resolves the
      # exact tree recorded in the committed package-lock.json (AD-2).
      - name: Install dependencies
        working-directory: docs-site
        run: npm ci

      # VitePress's SSR render pass logs a per-page error (e.g. a
      # ReferenceError from a browser-only global read outside onMounted)
      # to stderr but still exits 0 -- it silently drops the broken
      # component from the static HTML instead of failing the build.
      # Capture the full output here so later steps can inspect it, not
      # just trust this step's exit code.
      - name: Build with VitePress
        working-directory: docs-site
        run: |
          set -o pipefail
          npm run docs:build 2>&1 | tee "$RUNNER_TEMP/docs-build.log"

      # Catches crash-style SSR failures (a genuinely-undefined browser-only
      # global, e.g. `window.*`, throws during SSR and logs one of these).
      # Word-boundaried to avoid false positives from incidental substring
      # matches elsewhere in the build log.
      #
      # This check alone is NOT sufficient: a top-level `navigator.userAgent`
      # read does not crash or log anything here at all, because Node 21+'s
      # own built-in `navigator` polyfill silently resolves it to
      # "Node.js/<version>" -- see the next step.
      - name: Check build output for crash-style SSR errors
        run: |
          if grep -iE '\b(ReferenceError|TypeError|SyntaxError)\b|\bis not defined\b' "$RUNNER_TEMP/docs-build.log"; then
            echo "::error::VitePress SSR build logged a crash-style error above (ReferenceError/TypeError/SyntaxError/'is not defined') -- a browser-only global was likely read outside onMounted. Failing the job rather than deploying a broken/degraded page."
            exit 1
          fi

      # Closes the gap the log-text check above cannot: a top-level
      # `navigator.userAgent` read in ParseDemo.vue doesn't throw during SSR
      # (Node's built-in `navigator` polyfill resolves it to
      # "Node.js/<version>" instead), so it produces a clean exit code and a
      # clean build log while silently baking a fake value into the static
      # HTML. Inspecting the actual built artifact -- not inferring from log
      # text -- is what catches that.
      - name: Check built dist for silently-baked SSR values
        working-directory: docs-site
        run: |
          DIST_INDEX=".vitepress/dist/index.html"
          if [ ! -f "$DIST_INDEX" ]; then
            echo "::error::$DIST_INDEX not found -- the build may have failed before producing output."
            exit 1
          fi
          if ! grep -q "Detecting your browser" "$DIST_INDEX"; then
            echo "::error::$DIST_INDEX is missing ParseDemo's loading-placeholder text ('Detecting your browser…') -- the SSR pre-mount state was not rendered as expected."
            exit 1
          fi
          if grep -q "Node.js/" "$DIST_INDEX"; then
            echo "::error::$DIST_INDEX contains 'Node.js/' -- this is the signature of Node's navigator.userAgent polyfill leaking into the static HTML, meaning navigator.userAgent was read outside onMounted during SSR."
            exit 1
          fi

      # Protects the load-bearing script ordering the config.ts comments
      # call out (spec-google-analytics-consent-mode.md): the
      # `gtag('consent', 'default', ...)` script MUST appear before the
      # googletagmanager.com/gtag/js loader tag in the actual built HTML, or
      # Consent Mode v2 doesn't gate collection at all. Inspecting the real
      # built artifact -- not the source config.ts -- catches a bundler/head
      # reordering regression that source inspection alone would miss, same
      # pattern as the two dist-inspection checks above.
      - name: Check GA consent-default script precedes gtag.js loader in dist
        working-directory: docs-site
        run: |
          DIST_INDEX=".vitepress/dist/index.html"
          CONSENT_OFFSET=$(grep -bo 'gtag("consent","default"' "$DIST_INDEX" | head -1 | cut -d: -f1)
          GTAG_JS_OFFSET=$(grep -bo 'googletagmanager.com/gtag/js' "$DIST_INDEX" | head -1 | cut -d: -f1)
          if [ -z "$CONSENT_OFFSET" ] || [ -z "$GTAG_JS_OFFSET" ]; then
            echo "::error::Could not find both the consent-default script (gtag(\"consent\",\"default\") and the gtag.js loader (googletagmanager.com/gtag/js) in $DIST_INDEX -- expected both present in a production build."
            exit 1
          fi
          if [ "$CONSENT_OFFSET" -ge "$GTAG_JS_OFFSET" ]; then
            echo "::error::Consent Mode v2 ordering violated in $DIST_INDEX: the consent-default script (byte offset $CONSENT_OFFSET) does not precede the gtag.js loader script tag (byte offset $GTAG_JS_OFFSET). This defeats Consent Mode -- gtag.js must never load before consent defaults are set."
            exit 1
          fi
          echo "OK: consent-default script (offset $CONSENT_OFFSET) precedes gtag.js loader (offset $GTAG_JS_OFFSET)."

      # None of the checks above can see GenerateDemo.vue's merge-and-retry
      # logic (spec-5-4-live-generate-demo.md, review_loop_iteration 1): it
      # only runs client-side inside onMounted/on click, never during the
      # SSR build pass those steps inspect. This script exercises the
      # extracted, framework-free resolveGenerateFields directly against
      # the real installed @lempert/user-agent package (already resolved
      # by `npm ci` above) and fails the job if the visitor's explicit
      # filter selections stop winning over the randomizer -- the specific
      # regression shape this step exists to catch.
      - name: Verify generate-demo merge logic
        working-directory: docs-site
        run: node scripts/verify-generate-demo.mjs

      # Same rationale as the step above, for ConsentBanner.vue's
      # onMounted decision logic (spec-google-analytics-consent-mode.md):
      # it only runs client-side, so none of the SSR-build-output checks
      # above can see it. This script exercises the extracted,
      # framework-free decideConsentOnMount directly and fails the job if
      # banner visibility or the granted-signals consent-update call ever
      # stops matching the stored choice.
      - name: Verify consent banner decision logic
        working-directory: docs-site
        run: node scripts/verify-consent-decision.mjs

      # VitePress's own dead-link checker strips URL fragments before
      # checking a link, so a broken in-page anchor (e.g. a heading's
      # wording edited without updating a matching `{#id}` override, or a
      # stale slug baked into a cross-page link) still produces a clean,
      # passing build -- see spec-legal-disclaimers-page.md finding #5.
      # This script re-derives every heading's real id (explicit `{#id}`
      # or VitePress's own auto-generated slug) and every internal link's
      # target anchor from the actual markdown source, plus every
      # nav/sidebar `link` in config.ts, and fails if any of them don't
      # resolve.
      - name: Verify internal links and anchors
        working-directory: docs-site
        run: node scripts/verify-links-and-anchors.mjs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/.vitepress/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
